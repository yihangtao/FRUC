name: fruc
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - ninja
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - torch==2.4.1+cu121
      - torchvision==0.19.1+cu121
      - -r requirements.txt
      - -r requirements_data.txt
      - -r requirements_demo.txt
